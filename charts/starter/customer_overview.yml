title: Customer Overview
source: bank_demo
notes: Customer counts and characteristics from the one-row-per-customer modeled dimension.
variables:
  segment:
    column: DBT_ADEBNEY.DIM_BANK_RAW__CUSTOMER.CUSTOMER_SEGMENT
  state:
    column: DBT_ADEBNEY.DIM_BANK_RAW__CUSTOMER.STATE_CODE
queries:
  headline:
    sql: |
      SELECT COUNT(*) AS customers,
             ROUND(AVG(fico), 0) AS average_fico,
             ROUND(AVG(estimated_income), 0) AS average_estimated_income
      FROM DBT_ADEBNEY.DIM_BANK_RAW__CUSTOMER
      WHERE {{ filter('customer_segment', segment) }}
        AND {{ filter('state_code', state) }}
    formats:
      average_estimated_income: currency
  acquisition:
    sql: |
      WITH monthly AS (
        SELECT DATE_TRUNC('month', registration_date)::DATE AS registration_month,
               COUNT(*) AS new_customers
        FROM DBT_ADEBNEY.DIM_BANK_RAW__CUSTOMER
        WHERE {{ filter('customer_segment', segment) }}
          AND {{ filter('state_code', state) }}
        GROUP BY 1
      ), bounds AS (
        SELECT MIN(registration_month) AS first_month,
               MAX(registration_month) AS last_month FROM monthly
      ), calendar AS (
        SELECT DATEADD(month, ROW_NUMBER() OVER (ORDER BY SEQ4()) - 1,
                       bounds.first_month)::DATE AS registration_month,
               bounds.last_month
        FROM bounds, TABLE(GENERATOR(ROWCOUNT => 300))
      )
      SELECT calendar.registration_month,
             COALESCE(monthly.new_customers, 0) AS new_customers
      FROM calendar
      LEFT JOIN monthly ON calendar.registration_month = monthly.registration_month
      WHERE calendar.registration_month <= calendar.last_month
      ORDER BY 1
  segments:
    sql: |
      SELECT COALESCE(customer_segment, 'Unspecified') AS customer_segment,
             COUNT(*) AS customers
      FROM DBT_ADEBNEY.DIM_BANK_RAW__CUSTOMER
      WHERE {{ filter('customer_segment', segment) }}
        AND {{ filter('state_code', state) }}
      GROUP BY 1 ORDER BY 2 DESC
  products:
    sql: |
      SELECT 'Credit card' AS product, COUNT_IF(has_credit_card) AS customers
      FROM DBT_ADEBNEY.DIM_BANK_RAW__CUSTOMER
      WHERE {{ filter('customer_segment', segment) }} AND {{ filter('state_code', state) }}
      UNION ALL
      SELECT 'Auto loan', COUNT_IF(has_auto_loan)
      FROM DBT_ADEBNEY.DIM_BANK_RAW__CUSTOMER
      WHERE {{ filter('customer_segment', segment) }} AND {{ filter('state_code', state) }}
      UNION ALL
      SELECT 'Mortgage', COUNT_IF(has_mortgage)
      FROM DBT_ADEBNEY.DIM_BANK_RAW__CUSTOMER
      WHERE {{ filter('customer_segment', segment) }} AND {{ filter('state_code', state) }}
charts:
  customers:
    type: kpi
    query: headline
    value: customers
    label: Customers
  fico:
    type: kpi
    query: headline
    value: average_fico
    label: Average FICO
  income:
    type: kpi
    query: headline
    value: average_estimated_income
    label: Average estimated income
  acquisition:
    type: line
    query: acquisition
    title: New customers by registration month
    x: registration_month
    y: new_customers
  segments:
    type: bar
    query: segments
    title: Customers by segment
    x: customer_segment
    y: customers
  products:
    type: bar
    query: products
    title: Customers holding each product
    subtitle: Product groups overlap; a customer may hold more than one.
    x: product
    y: customers
rows:
  - cols: [customers, fico, income]
  - acquisition
  - cols: [segments, products]
