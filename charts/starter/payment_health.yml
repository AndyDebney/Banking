title: Payment Health
source: bank_demo
notes: Payments and delinquency measured per payment row, by payment date.
variables:
  product:
    column: DBT_ADEBNEY.FCT_BANK_RAW__PAYMENTS.PRODUCT_TYPE
  period:
    column: DBT_ADEBNEY.FCT_BANK_RAW__PAYMENTS.PAYMENT_DATE
    input: daterange
queries:
  headline:
    sql: |
      SELECT COUNT(*) AS payments,
             SUM(payment_amount) AS amount_paid,
             COUNT_IF(is_delinquent_payment) / NULLIF(COUNT(*), 0) AS delinquent_payment_rate
      FROM DBT_ADEBNEY.FCT_BANK_RAW__PAYMENTS
      WHERE {{ filter('product_type', product) }}
        AND {{ filter_date_range('payment_date', period) }}
    formats:
      amount_paid: currency
      delinquent_payment_rate: percent
  monthly:
    sql: |
      SELECT DATE_TRUNC('month', payment_date)::DATE AS payment_month,
             SUM(payment_amount) AS amount_paid,
             COUNT(*) AS payments,
             COUNT_IF(is_delinquent_payment) / NULLIF(COUNT(*), 0) AS delinquent_payment_rate
      FROM DBT_ADEBNEY.FCT_BANK_RAW__PAYMENTS
      WHERE {{ filter('product_type', product) }}
        AND {{ filter_date_range('payment_date', period) }}
      GROUP BY 1 ORDER BY 1
    formats:
      amount_paid: currency
      delinquent_payment_rate: percent
  by_product:
    sql: |
      SELECT REPLACE(INITCAP(REPLACE(product_type, '_', ' ')), 'Card', 'card') AS product,
             COUNT(*) AS payments,
             SUM(payment_amount) AS amount_paid,
             COUNT_IF(is_delinquent_payment) / NULLIF(COUNT(*), 0) AS delinquent_payment_rate
      FROM DBT_ADEBNEY.FCT_BANK_RAW__PAYMENTS
      WHERE {{ filter('product_type', product) }}
        AND {{ filter_date_range('payment_date', period) }}
      GROUP BY 1 ORDER BY 1
    formats:
      amount_paid: currency
      delinquent_payment_rate: percent
charts:
  payments:
    type: kpi
    query: headline
    value: payments
    label: Payments
  amount:
    type: kpi
    query: headline
    value: amount_paid
    label: Amount paid
  delinquent:
    type: kpi
    query: headline
    value: delinquent_payment_rate
    label: Delinquent payment rate
  monthly_amount:
    type: line
    query: monthly
    title: Payment amount by month
    x: payment_month
    y: amount_paid
  monthly_rate:
    type: line
    query: monthly
    title: Delinquent payment rate by month
    x: payment_month
    y: delinquent_payment_rate
  by_product:
    type: table
    query: by_product
    title: Payment health by product
rows:
  - cols: [payments, amount, delinquent]
  - cols: [monthly_amount, monthly_rate]
  - by_product
