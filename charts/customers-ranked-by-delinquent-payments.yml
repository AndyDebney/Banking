title: Customers ranked by delinquent payments
source: bank_demo
notes: No failed-payment or declined-transaction field is available in the bank payment data. Delinquency is a late-payment flag, not evidence that a payment attempt failed. Rankings include customers with at least one delinquent payment, across all available payment dates and products.
queries:
  top_customers:
    sql: |
      WITH counts AS (
        SELECT customer_key, COUNT_IF(is_delinquent_payment) AS delinquent_payments
        FROM DBT_ADEBNEY.FCT_BANK_RAW__PAYMENTS
        GROUP BY customer_key
      )
      SELECT c.first_name || ' ' || c.last_name || ' (#' || c.customer_key || ')' AS customer,
             p.delinquent_payments
      FROM counts p
      JOIN DBT_ADEBNEY.DIM_BANK_RAW__CUSTOMER c ON c.customer_key = p.customer_key
      WHERE p.delinquent_payments > 0
      ORDER BY p.delinquent_payments DESC, c.customer_key
      LIMIT 15
  ranked_customers:
    sql: |
      WITH counts AS (
        SELECT customer_key,
               COUNT_IF(is_delinquent_payment) AS delinquent_payments,
               COUNT(*) AS total_payments
        FROM DBT_ADEBNEY.FCT_BANK_RAW__PAYMENTS
        GROUP BY customer_key
      )
      SELECT DENSE_RANK() OVER (ORDER BY p.delinquent_payments DESC) AS rank,
             c.first_name || ' ' || c.last_name AS customer,
             c.customer_key,
             p.delinquent_payments,
             p.total_payments
      FROM counts p
      JOIN DBT_ADEBNEY.DIM_BANK_RAW__CUSTOMER c ON c.customer_key = p.customer_key
      WHERE p.delinquent_payments > 0
      ORDER BY p.delinquent_payments DESC, c.customer_key
charts:
  leaders:
    type: bar
    query: top_customers
    title: Top 15 customers by delinquent payments
    subtitle: Delinquent means flagged late, not a failed payment attempt.
    x: customer
    y: delinquent_payments
  full_ranking:
    type: table
    query: ranked_customers
    title: Full customer ranking by delinquent payments
rows:
  - leaders
  - full_ranking
