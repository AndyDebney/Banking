title: Payments Overview
source: bank_demo
notes: Payment activity is measured per payment row using payment date. Payment type means product type (auto loan, credit card, or mortgage). Status is derived only from the delinquency flag; "Not flagged delinquent" is not a processing or settlement status.
variables:
  product:
    column: DBT_ADEBNEY.FCT_BANK_RAW__PAYMENTS.PRODUCT_TYPE
  period:
    column: DBT_ADEBNEY.FCT_BANK_RAW__PAYMENTS.PAYMENT_DATE
    input: daterange
queries:
  headline:
    sql: |
      SELECT COUNT(*) AS payments,
             COALESCE(SUM(payment_amount), 0) AS amount_paid,
             COUNT(DISTINCT customer_key) AS paying_customers,
             COUNT_IF(is_delinquent_payment) / NULLIF(COUNT(*), 0) AS delinquent_payment_rate
      FROM DBT_ADEBNEY.FCT_BANK_RAW__PAYMENTS
      WHERE {{ filter('product_type', product) }}
        AND {{ filter_date_range('payment_date', period) }}
    formats:
      amount_paid: currency
      delinquent_payment_rate: percent
  monthly:
    sql: |
      SELECT DATE_TRUNC('month', payment_date)::DATE AS payment_month,
             COUNT(*) AS payments,
             SUM(payment_amount) AS amount_paid,
             COUNT_IF(is_delinquent_payment) / NULLIF(COUNT(*), 0) AS delinquent_payment_rate
      FROM DBT_ADEBNEY.FCT_BANK_RAW__PAYMENTS
      WHERE {{ filter('product_type', product) }}
        AND {{ filter_date_range('payment_date', period) }}
      GROUP BY 1
      ORDER BY 1
    formats:
      amount_paid: currency
      delinquent_payment_rate: percent
  by_product:
    sql: |
      SELECT REPLACE(INITCAP(REPLACE(product_type, '_', ' ')), 'Card', 'card') AS product,
             COUNT(*) AS payments,
             SUM(payment_amount) AS amount_paid,
             COUNT(DISTINCT customer_key) AS paying_customers,
             COUNT_IF(is_delinquent_payment) / NULLIF(COUNT(*), 0) AS delinquent_payment_rate
      FROM DBT_ADEBNEY.FCT_BANK_RAW__PAYMENTS
      WHERE {{ filter('product_type', product) }}
        AND {{ filter_date_range('payment_date', period) }}
      GROUP BY 1
      ORDER BY amount_paid DESC
    formats:
      amount_paid: currency
      delinquent_payment_rate: percent
  by_type_status:
    sql: |
      SELECT REPLACE(INITCAP(REPLACE(product_type, '_', ' ')), 'Card', 'card') AS payment_type,
             CASE WHEN is_delinquent_payment = TRUE THEN 'Delinquent'
                  WHEN is_delinquent_payment = FALSE THEN 'Not flagged delinquent'
                  ELSE 'Unknown' END AS delinquency_status,
             COUNT(*) AS payments,
             SUM(payment_amount) AS amount_paid
      FROM DBT_ADEBNEY.FCT_BANK_RAW__PAYMENTS
      WHERE {{ filter('product_type', product) }}
        AND {{ filter_date_range('payment_date', period) }}
      GROUP BY 1, 2
      ORDER BY 1, 2
    formats:
      amount_paid: currency
  by_status:
    sql: |
      SELECT CASE WHEN is_delinquent_payment = TRUE THEN 'Delinquent'
                  WHEN is_delinquent_payment = FALSE THEN 'Not flagged delinquent'
                  ELSE 'Unknown' END AS delinquency_status,
             COUNT(*) AS payments,
             SUM(payment_amount) AS amount_paid
      FROM DBT_ADEBNEY.FCT_BANK_RAW__PAYMENTS
      WHERE {{ filter('product_type', product) }}
        AND {{ filter_date_range('payment_date', period) }}
      GROUP BY 1
      ORDER BY 1
    formats:
      amount_paid: currency
charts:
  payments:
    type: kpi
    query: headline
    value: payments
    label: Payments
  amount:
    type: kpi
    query: headline
    value: amount_paid
    label: Amount paid
  customers:
    type: kpi
    query: headline
    value: paying_customers
    label: Paying customers
  delinquent:
    type: kpi
    query: headline
    value: delinquent_payment_rate
    label: Delinquent payment rate
  monthly_amount:
    type: line
    query: monthly
    title: Amount paid by month
    x: payment_month
    y: amount_paid
  monthly_payments:
    type: bar
    query: monthly
    title: Payments by month
    x: payment_month
    y: payments
  monthly_delinquency:
    type: line
    query: monthly
    title: Delinquent payment rate by month
    x: payment_month
    y: delinquent_payment_rate
  product_mix:
    type: bar
    query: by_product
    title: Amount paid by product
    x: product
    y: amount_paid
  product_details:
    type: table
    query: by_product
    title: Payments by product
  type_status_payments:
    type: bar
    query: by_type_status
    title: Payments by type and delinquency status
    x: payment_type
    y: payments
    color: delinquency_status
  type_status_amount:
    type: bar
    query: by_type_status
    title: Amount paid by type and delinquency status
    x: payment_type
    y: amount_paid
    color: delinquency_status
  status_details:
    type: table
    query: by_status
    title: Delinquency status totals
  type_status_details:
    type: table
    query: by_type_status
    title: Payment type and delinquency status details
rows:
  - cols: [payments, amount, customers, delinquent]
  - cols: [type_status_payments, type_status_amount]
  - cols: [status_details, type_status_details]
  - cols: [monthly_amount, monthly_payments]
  - cols: [monthly_delinquency, product_mix]
  - product_details
