
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'bank_demo'
version: '1.0.0'
config-version: 2

profile: 'bank_demo'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

# 1.10.5 is the first release that understands the `arguments:` form used by
# the generic tests in models/**/*.yml.
require-dbt-version: [">=1.10.5", "<2.0.0"]
