version: 2

models:
  - name: dim_bank_raw__customer
    description: One row per customer with customer, profile, product, and state attributes.
    columns:
      - name: customer_key
        data_tests:
          - not_null
          - unique
      - name: state_code
        data_tests:
          - not_null
      - name: has_credit_card
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: has_mortgage
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: has_auto_loan
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false

  - name: fct_bank_raw__payments
    description: One row per payment event across auto loan, credit card, and mortgage products.
    columns:
      - name: payment_id
        data_tests:
          - not_null
          - unique
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_bank_raw__customer')
                field: customer_key
      - name: account_key
        data_tests:
          - not_null
      - name: product_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['auto_loan', 'credit_card', 'mortgage']
      - name: product_identifier
        data_tests:
          - not_null
      - name: payment_date
        data_tests:
          - not_null
      - name: payment_due_date
        data_tests:
          - not_null
