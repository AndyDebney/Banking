    description: 1:1 staging model for the `bank_raw.mortgage_payment` source.
    columns:
      - name: mortgage_id
        data_tests:
          - not_null

  - name: stg_bank_raw__product_profile
    description: 1:1 staging model for the `bank_raw.product_profile` source.
    columns:
