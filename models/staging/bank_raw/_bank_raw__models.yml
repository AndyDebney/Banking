version: 2

models:
  - name: stg_bank_raw__account
    description: 1:1 staging model for the `bank_raw.account` source.
    columns:
      - name: acctkey
        data_tests:
          - not_null
          - unique
      - name: custkey
        data_tests:
          - not_null

  - name: stg_bank_raw__auto_loan_payment
    description: 1:1 staging model for the `bank_raw.auto_loan_payment` source.
    columns:
      - name: auto_loan_id
        data_tests:
          - not_null

  - name: stg_bank_raw__credit_card_payment
    description: 1:1 staging model for the `bank_raw.credit_card_payment` source.
    columns:
